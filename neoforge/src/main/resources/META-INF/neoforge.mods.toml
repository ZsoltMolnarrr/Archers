license = "All Rights Reserved"

[[mods]]
modId = "archers"
version = "${version}"
displayName = "Archers (RPG Series)"
authors = "Daedelus"
description = '''
Draw, Release, Conquer - Master the art of Archery!
'''
logoFile = "assets/archers/icon.png"

[[dependencies.archers]]
modId = "neoforge"
type = "required"
