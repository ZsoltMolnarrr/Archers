side = "BOTH"

[[dependencies.archers]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_compat_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archers]]
modId = "forgified_fabric_api"
type = "required"
versionRange = "[${forgified_fabric_api_version},)"
ordering = "NONE"
side = "BOTH"

