# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
# Both platforms since 3.1.1.002: RangedWeaponAPI now has a 1.20.1 Forge artifact
# (net.foundation:ranged_weapon_api-forge:2.3.4.001+1.20.1), which was the only reason this line was
# Fabric-only. See docs/version-adoption-1.20.1/briefs/archers-port-notes.md.
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.rpg_series
archives_name=archers
mod_version=3.1.1.007

# Dependencies
fabric_api_version=0.92.12+1.20.1
# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4

# mavenLocal coordinates: net.rpg_foundation:armor_model_api-<platform>:<version>
armor_model_api_version=1.0.0.001+1.20.1
# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
spell_engine_version=1.10.5.030+1.20.1
# mavenLocal coordinates: com.github.TheRedBrain:bundle-api-<platform>:<version>
bundle_api_version=1.1.0.001
# mavenLocal coordinates: net.foundation:ranged_weapon_api-<platform>:<version>
# (the 1.20.1-modern port of RWA 2.3.4 — Fabric *and* Forge; a hard dependency of Archers)
ranged_weapon_api_version=2.3.4.005+1.20.1
# mavenLocal coordinates: net.foundation:structure_pool_api-<platform>:<version>
# 1.2.1 is the first 1.20.1 build with a Forge artifact, so vanilla-village injection now runs on
# both loaders straight from `common` (no `VillageStructures` seam any more).
structure_pool_api_version=1.2.1.001+1.20.1

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0
mod_menu_version=7.2.1

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; the ecosystem libraries JiJ it in production, but Loom does not
# load nested jars of classpath mods, so the dev runtime needs an explicit pin.
# >= 0.5.0 is REQUIRED: sponge-mixin 0.17 (pulled by Fabric Loader 0.19.5) declares `@Redirect.at()` as
# `At[]`; MixinExtras 0.4.1's FactoryRedirectWrapperMixinTransformer casts that straight to AnnotationNode
# and dies with `ClassCastException: ArrayList cannot be cast to AnnotationNode` during Bootstrap.
mixin_extras_version=0.5.5
