# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.2     multiple: minecraft_compat_versions=26.2:26.2.1
minecraft_compat_versions=26.2

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 26.2.0.75

# Mod
maven_group=net.rpg_series
archives_name=archers
mod_version=3.1.2.008

# Dependencies
fabric_api_version=0.159.0+26.2
tiny_config_version=4.0.1
cloth_config_version=26.2.155
player_anim_version=1.2.6+mc.26.2
# Compile-only: IrisCompat reaches IrisApi behind an isModLoaded gate
iris_version=1.11.2+26.2

bundle_api_version=1.1.1.001+26.2
armor_model_api_version=1.1.0.001+26.2
ranged_weapon_api_version=4.0.0.001+26.2
structure_pool_api_version=1.3.0.001+26.2
spell_power_version=1.6.1.002+26.2
spell_engine_version=1.10.5.013+26.2

# Fabric only
trinkets_version=4.1.0-rc.1+26.2
mod_menu_version=20.0.1

# NeoForge only
curios_version=16.0.0+26.2
