# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
# FABRIC ONLY on the 1.20.1 line: RangedWeaponAPI has no Forge artifact for 1.20.1, and every Archers
# ranged weapon is a RWA CustomBow/CustomCrossbow. See docs/version-adoption-1.20.1/briefs/archers-port-notes.md
# ("What a Forge build would require") before adding `forge` back here.
enabled_platforms = fabric
fabric_loader_version=0.19.5

# Mod
maven_group=net.rpg_series
archives_name=archers
mod_version=3.1.1.001

# Dependencies
fabric_api_version=0.92.12+1.20.1
# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric)
player_anim_version=1.0.2+1.19.4

# mavenLocal coordinates: net.rpg_foundation:armor_model_api-<platform>:<version>
armor_model_api_version=1.0.0.001+1.20.1
# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
spell_engine_version=1.10.5.002+1.20.1
# mavenLocal coordinates: com.github.TheRedBrain:bundle-api-<platform>:<version>
bundle_api_version=1.1.0.001
# Legacy published Fabric-only artifacts (maven.modrinth); no Forge/1.20.1-modern port exists
ranged_weapon_api_version=1.1.0+1.20.1
structure_pool_api_version=1.0+1.20.1

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0
mod_menu_version=7.2.1
