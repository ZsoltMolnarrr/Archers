loom {
    accessWidenerPath = file("src/main/resources/archers.accesswidener")
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url = 'https://repo.redlance.org/public' } // PAL (Player Animation Library)
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
//    modImplementation("maven.modrinth:armor-model-api:${project.armor_model_api_version}-${platform}")
    modImplementation("net.rpg_foundation:armor_model_api-${platform}:${project.armor_model_api_version}")
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")

//    modImplementation("maven.modrinth:bundle-api:${project.bundle_api_version}-${platform}")
    modImplementation("com.github.TheRedBrain:bundle-api-${platform}:${project.bundle_api_version}")
//    modImplementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    modImplementation("net.rpg_foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
//    modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    modImplementation("net.foundation:ranged_weapon_api-${platform}:${project.ranged_weapon_api_version}")
//    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    modImplementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
    // `transitive = false`: the local-maven pom drags in Cardinal Components, whose Loom-injected
    // interfaces on `Entity` then fail to resolve here. Everything SpellEngine needs is declared above.
    modImplementation("net.spell_engine:spell_engine-${platform}:${project.spell_engine_version}") { transitive = false }

    // Compatibility
    // Fabric specific
}
