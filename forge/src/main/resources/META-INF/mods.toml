modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/ZsoltMolnarrr/Archers/issues"
license = "All Rights Reserved"

[[mods]]
modId = "archers"
version = "${version}"
displayName = "Archers (RPG Series)"
authors = "Daedelus"
description = '''
Draw, Release, Conquer - Master the art of Archery!
'''
logoFile = "icon.png"

[[dependencies.archers]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archers]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archers]]
modId = "armor_model_api"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archers]]
modId = "spell_engine"
mandatory = true
versionRange = "[1.10.5,)"
ordering = "AFTER"
side = "BOTH"

# Every Archers bow/crossbow is a RangedWeaponAPI CustomBow/CustomCrossbow (see ArcherWeapons).
[[dependencies.archers]]
modId = "ranged_weapon_api"
mandatory = true
versionRange = "[2.3.4,)"
ordering = "AFTER"
side = "BOTH"

# Quivers are BundleAPI CustomBundleItems (see Quivers). The library is JiJ'd, but kept optional so a
# user-managed copy also satisfies it — and so Archers still boots (without quivers) if it is ever
# removed; every use of Quivers is gated on the mod being loaded. Forge 47 aborts the boot on an
# optional dependency with an empty `versionRange`, so the range is explicit.
[[dependencies.archers]]
modId = "bundleapi"
mandatory = false
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.archers]]
modId = "curios"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# StructurePoolAPI injects the archery ranges into the *vanilla* village pools. Since 1.2.1 it has a
# Forge artifact, so this is a hard dependency on both loaders (mirrors the `fabric.mod.json` entry).
[[dependencies.archers]]
modId = "structure_pool_api"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "NONE"
side = "BOTH"

# Mixin configs are declared in the jar MANIFEST (`MixinConfigs:`) by Loom (`loom.forge.mixinConfig`),
# not in this file — the `[[mixins]]` table is NeoForge-only.
